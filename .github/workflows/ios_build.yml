# ==============================================================================
# SoldierSmash iOS IPA & Apple TestFlight Deployment Workflow
# ==============================================================================
#
# REQUIRED GITHUB REPOSITORY SECRETS:
# ------------------------------------------------------------------------------
# Configure the following secrets in:
# GitHub Repository -> Settings -> Secrets and variables -> Actions
#
# 1. APPLE_TEAM_ID
#    - Description: 10-character Apple Developer Team ID
#    - Example: A1B2C3D4E5
#    - Where to find: https://developer.apple.com/account under "Membership details"
#
# 2. APP_STORE_CONNECT_KEY_ID
#    - Description: 10-character Key ID for the App Store Connect API Key
#    - Example: 2X9R4ABCD2
#    - Where to find: App Store Connect -> Users and Access -> Integrations -> Keys
#
# 3. APP_STORE_CONNECT_ISSUER_ID
#    - Description: App Store Connect Issuer UUID
#    - Example: 69a6de70-abcd-47e3-e053-5b8c7c11a4d1
#    - Where to find: App Store Connect -> Users and Access -> Integrations -> Keys (top of page)
#
# 4. APP_STORE_CONNECT_PRIVATE_KEY
#    - Description: The full text contents of your downloaded AuthKey_<KEY_ID>.p8 file
#    - Example:
#        -----BEGIN PRIVATE KEY-----
#        MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQg...
#        -----END PRIVATE KEY-----
#
# PREREQUISITES IN APPLE DEVELOPER & APP STORE CONNECT:
# ------------------------------------------------------------------------------
# 1. Bundle Identifier: com.zemolabs.soldiersmash must be registered in Apple Developer Portal.
# 2. App Store Connect App: An app record with bundle id com.zemolabs.soldiersmash must exist.
# 3. API Key Role: The App Store Connect API Key must have the "App Manager" or "Admin" role
#    (or Developer role with "Access to Certificates, Identifiers & Profiles").
# ==============================================================================

name: SoldierSmash iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'IPA distribution method (use app-store for TestFlight)'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - development
          - ad-hoc
      upload_to_testflight:
        description: 'Upload exported IPA to Apple TestFlight'
        required: true
        default: true
        type: boolean
      build_number:
        description: 'Optional iOS build number (CFBundleVersion). Defaults to GitHub run number.'
        required: false
        type: string
      app_version:
        description: 'Optional marketing version (CFBundleShortVersionString, e.g. 1.0.0)'
        required: false
        type: string
      release_notes:
        description: 'Optional TestFlight "What to Test" release notes'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ipa:
    name: Archive, Export & Deploy IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Secrets with sample fallback placeholders so the workflow is self-documenting
      # and can be updated later in repository secrets.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'SAMPLE_TEAM_ID_XXXXXXXXXX' }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'SAMPLE_KEY_ID_XXXXXXXXXX' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '00000000-0000-0000-0000-000000000000' }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || '-----BEGIN PRIVATE KEY-----\nSAMPLE_KEY_CONTENT_PLEASE_UPDATE_IN_GITHUB_SECRETS\n-----END PRIVATE KEY-----' }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      IOS_BUNDLE_ID: com.zemolabs.soldiersmash
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_APP_VERSION: ${{ inputs.app_version }}
      UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate export and signing configuration
        run: |
          set -euo pipefail

          echo "=== Checking Apple Developer Configuration & Secrets ==="
          HAS_SAMPLE_SECRETS=0

          if [[ "$APPLE_TEAM_ID" == *"SAMPLE_"* ]] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::APPLE_TEAM_ID is using a sample placeholder or is empty."
            HAS_SAMPLE_SECRETS=1
          fi

          if [[ "$APP_STORE_CONNECT_KEY_ID" == *"SAMPLE_"* ]] || [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY_ID is using a sample placeholder or is empty."
            HAS_SAMPLE_SECRETS=1
          fi

          if [[ "$APP_STORE_CONNECT_ISSUER_ID" == *"00000000-"* ]] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "::warning::APP_STORE_CONNECT_ISSUER_ID is using a sample placeholder or is empty."
            HAS_SAMPLE_SECRETS=1
          fi

          if [[ "$APP_STORE_CONNECT_PRIVATE_KEY" == *"SAMPLE_"* ]] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::warning::APP_STORE_CONNECT_PRIVATE_KEY is using a sample placeholder or is empty."
            HAS_SAMPLE_SECRETS=1
          fi

          if [ "$HAS_SAMPLE_SECRETS" -eq 1 ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Action Required: Configure Apple Developer Secrets
          The workflow was executed using **sample / placeholder secrets**.

          To sign and deploy SoldierSmash to TestFlight, configure the following secrets in:
          **GitHub Repository → Settings → Secrets and variables → Actions**

          | Secret Name | Description | Example / Format |
          |---|---|---|
          | `APPLE_TEAM_ID` | Apple Developer Team ID | `A1B2C3D4E5` |
          | `APP_STORE_CONNECT_KEY_ID` | App Store Connect API Key ID | `2X9R4ABCD2` |
          | `APP_STORE_CONNECT_ISSUER_ID` | App Store Connect Issuer UUID | `69a6de70-abcd-47e3-e053-5b8c7c11a4d1` |
          | `APP_STORE_CONNECT_PRIVATE_KEY` | Contents of downloaded `AuthKey_*.p8` file | `-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----` |
          EOF

            echo "::error title=Missing Apple Secrets::Please configure the required Apple credentials in GitHub Secrets before building. See job summary for details."
            exit 1
          fi

          echo "=== Validating Project Structure ==="
          test -d Build/ios/Unity-iPhone.xcodeproj
          python3 tools/remove_stale_firebase_ios_links.py
          pod install --project-directory=Build/ios --repo-update
          test -d Build/ios/Unity-iPhone.xcworkspace
          xcodebuild -version
          xcodebuild -list -workspace Build/ios/Unity-iPhone.xcworkspace
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" Build/ios/Unity-iPhone.xcodeproj/project.pbxproj
          # Unity's committed export currently targets iPad (2); accept any valid iOS family setting.
          xcodebuild -showBuildSettings -workspace Build/ios/Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release | grep -Eq '^[[:space:]]*TARGETED_DEVICE_FAMILY = (1|2|1,2)$'
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail

          umask 077; KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"; trap 'rm -f "$KEY"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"

          ARCHIVE="$RUNNER_TEMP/SoldierSmash.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          BUILD="${IOS_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"

          if ! [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "The iOS build number must be a positive integer; got '$BUILD'." >&2
            exit 1
          fi

          echo "=== Installing Provisioning Profile (if provided) ==="
          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILE_DIR"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/soldiersmash_prod_profile.mobileprovision"
            PROFILE_UUID="f4915c21-9ffd-42c0-8ac2-25d2e924dde9"
            cp "$PROFILE_DIR/soldiersmash_prod_profile.mobileprovision" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
            echo "Installed provisioning profile ${PROFILE_UUID} to $PROFILE_DIR"
          fi

          echo "=== Installing Distribution Certificate into Keychain (if provided) ==="
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

            CERT_PATH="$RUNNER_TEMP/distribution.p12"
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "Certificate imported successfully into build keychain."
          fi

          echo "=== Preparing Build Versioning & Export Compliance in Info.plist ==="
          # Update CFBundleVersion to ensure TestFlight receives unique, incrementing build numbers.
          plutil -replace CFBundleVersion -string "$BUILD" Build/ios/Info.plist
          echo "Updated CFBundleVersion to: $BUILD"

          if [ -n "$IOS_APP_VERSION" ]; then
            plutil -replace CFBundleShortVersionString -string "$IOS_APP_VERSION" Build/ios/Info.plist
            echo "Updated CFBundleShortVersionString to: $IOS_APP_VERSION"
          fi

          # Ensure ITSAppUsesNonExemptEncryption is false to avoid 'Missing Compliance' stall on TestFlight
          if plutil -extract ITSAppUsesNonExemptEncryption raw Build/ios/Info.plist >/dev/null 2>&1; then
            plutil -replace ITSAppUsesNonExemptEncryption -bool NO Build/ios/Info.plist
          else
            plutil -insert ITSAppUsesNonExemptEncryption -bool NO Build/ios/Info.plist
          fi
          echo "ITSAppUsesNonExemptEncryption confirmed set to false."

          echo "=== Running xcodebuild archive ==="
          XCODEBUILD_ARGS=(
            -workspace Build/ios/Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release
            -sdk iphoneos -destination generic/platform=iOS -archivePath "$ARCHIVE"
            -allowProvisioningUpdates -authenticationKeyPath "$KEY"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD"
            TARGETED_DEVICE_FAMILY="1,2"
          )
          if [ -n "$IOS_APP_VERSION" ]; then
            XCODEBUILD_ARGS+=(MARKETING_VERSION="$IOS_APP_VERSION")
          fi
          xcodebuild "${XCODEBUILD_ARGS[@]}" archive

          echo "=== Generating ExportOptions.plist ==="
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string "${IOS_EXPORT_METHOD:-app-store}" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert destination -string export "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert stripSwiftSymbols -bool YES "$RUNNER_TEMP/ExportOptions.plist"

          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Configuring manual signing with provisioning profile soldiersmash_prod_profile"
            plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert signingCertificate -string "Apple Distribution" "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert provisioningProfiles -dictionary "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert "provisioningProfiles.com\.zemolabs\.soldiersmash" -string "soldiersmash_prod_profile" "$RUNNER_TEMP/ExportOptions.plist"
          else
            plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          fi

          echo "=== Exporting IPA ==="
          if ! xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$EXPORT" -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"; then
            if [ "${UPLOAD_TO_TESTFLIGHT}" = "true" ] || [ "${IOS_EXPORT_METHOD:-app-store}" = "app-store" ]; then
              echo "::error::Export with app-store signing failed. TestFlight deployment requires a valid App Store distribution profile and certificate." >&2
              exit 1
            else
              echo "Export with ${IOS_EXPORT_METHOD} failed. Retrying with development signing..."
              plutil -replace method -string development "$RUNNER_TEMP/ExportOptions.plist"
              xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$EXPORT" -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            fi
          fi

          IPA="$(find "$EXPORT" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p Builds/ipa
          cp "$IPA" Builds/ipa/SoldierSmash.ipa
          unzip -t Builds/ipa/SoldierSmash.ipa
          echo "IPA successfully verified at Builds/ipa/SoldierSmash.ipa"

      - name: Upload IPA artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SoldierSmash-ipa-${{ github.run_number }}
          path: Builds/ipa/SoldierSmash.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload to Apple TestFlight
        if: ${{ inputs.upload_to_testflight == true && inputs.export_method == 'app-store' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: Builds/ipa/SoldierSmash.ipa
          issuer-id: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ env.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
